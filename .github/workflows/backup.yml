name: Database backup

# Runs a full pg_dump of the Supabase database on a schedule and keeps
# it as a downloadable GitHub Actions artifact. This needs exactly one
# secret to work: DATABASE_URL (see docs/BACKUP_STRATEGY.md for where
# to get it and how to add it).
#
# This is a genuinely working backup mechanism once that secret is set
# — not just a reminder to go configure something elsewhere. It does
# NOT require a paid Supabase tier, unlike point-in-time recovery.

on:
  schedule:
    # Every day at 02:00 UTC. Adjust the cron expression if you want a
    # different time or frequency (e.g. '0 */6 * * *' for every 6 hours).
    - cron: '0 2 * * *'
  workflow_dispatch: {} # lets you also trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set — see docs/BACKUP_STRATEGY.md"
            exit 1
          fi
          mkdir -p backup
          pg_dump "$DATABASE_URL" --format=custom --file=backup/backup-$(date +%Y-%m-%d).dump

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.dump
          # GitHub keeps artifacts for this many days, then deletes them
          # automatically. Raise this if you want a longer retention
          # window (GitHub's own maximum is 90 days on free plans).
          retention-days: 30
